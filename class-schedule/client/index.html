    const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; const GRID_DAYS=[1,2,3,4,5]; const PERIOD_ORDER=['p12','p34','p56','p78','p910'];
    const parseDate=value=>new Date(`${value}T12:00:00`); const toISO=date=>{const offset=date.getTimezoneOffset();return new Date(date.getTime()-offset*60000).toISOString().slice(0,10)}; const addDays=(date,count)=>{const copy=new Date(date);copy.setDate(copy.getDate()+count);return copy};
    const shanghaiClock=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).reduce((all,part)=>{if(part.type!=='literal')all[part.type]=part.value;return all},{});return {iso:`${parts.year}-${parts.month}-${parts.day}`,minutes:Number(parts.hour)*60+Number(parts.minute)}};
    const termStart=parseDate(TERM_START); const weekFor=date=>{const clean=parseDate(toISO(date));if(clean<termStart)return 0;return 1+Math.floor((clean-termStart)/86400000/7)};
    const active=(item,week)=>item.ranges.some(([a,b])=>week>=a&&week<=b); const rangesText=ranges=>ranges.map(([a,b])=>a===b?`${a}`:`${a}–${b}`).join(', '); const styleFor=item=>STYLE[COURSE[item.title].style]; const courseFor=item=>COURSE[item.title]; const periodIndex=item=>PERIOD_ORDER.indexOf(item.time); const escapeHTML=value=>String(value).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const initialDate=(()=>{const today=shanghaiClock().iso;return parseDate(today)<termStart?TERM_START:today})();
    const ALL_REMINDER_IDS=CLASSES.map(item=>item.id),REMINDER_DEFAULT_VERSION='all-reminders-v1';
    const savedReminderVersion=localStorage.getItem('schedule-reminder-default-version');
    const defaultReminders=savedReminderVersion===REMINDER_DEFAULT_VERSION?JSON.parse(localStorage.getItem('schedule-reminders')||'[]'):ALL_REMINDER_IDS;
    if(savedReminderVersion!==REMINDER_DEFAULT_VERSION){localStorage.setItem('schedule-reminders',JSON.stringify(ALL_REMINDER_IDS));localStorage.setItem('schedule-reminder-default-version',REMINDER_DEFAULT_VERSION)}
    const state={selected:initialDate,view:'daily',openId:null,reminders:defaultReminders,notes:JSON.parse(localStorage.getItem('schedule-subject-notes')||'{}'),reminderFired:JSON.parse(sessionStorage.getItem('schedule-reminder-fired')||'{}'),spokenAlerts:true};
    const isReminder=item=>state.reminders.includes(item.id); const hasNote=item=>Boolean(state.notes[item.title]?.trim());
    const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); const minutesNow=date=>date.getHours()*60+date.getMinutes();
    function isLiveClass(item,date){const now=shanghaiClock(),today=parseDate(now.iso);if(!sameDay(date,today)||item.day!==today.getDay())return false;const slot=PERIODS[item.time];return now.minutes>=slot.start&&now.minutes<slot.end}
    function activeDayItems(date){const wk=weekFor(date);return CLASSES.filter(item=>item.day===date.getDay()&&active(item,wk)).sort((a,b)=>periodIndex(a)-periodIndex(b))}
    function plannedDayItems(date){return CLASSES.filter(item=>item.day===date.getDay()).sort((a,b)=>periodIndex(a)-periodIndex(b))}
    function showToast(message,color='blue'){const node=document.createElement('div');node.className='toast';node.innerHTML=`<i style="background:${color==='coral'?'var(--coral)':'var(--blue)'}"></i><span>${message}</span>`;document.getElementById('toastArea').append(node);setTimeout(()=>node.remove(),4000)}
    function durationText(minutes){if(minutes<60)return `${minutes} minute${minutes===1?'':'s'}`;const hours=Math.floor(minutes/60),rest=minutes%60;return `${hours} hour${hours===1?'':'s'}${rest?` ${rest} minutes`:''}`}
    function dailyBulletin(date,items){if(!items.length)return 'There are no active classes in the routine for this date.';const now=shanghaiClock(),today=parseDate(now.iso);if(!sameDay(date,today))return `${items[0].title} begins in ${items[0].room} at ${PERIODS[items[0].time].label.split(' – ')[0]}.`;const current=now.minutes,live=items.find(item=>current>=PERIODS[item.time].start&&current<PERIODS[item.time].end);if(live){const remaining=PERIODS[live.time].end-current;return `${live.title} is in progress now in ${live.room}. ${durationText(remaining)} remaining.`}const next=items.find(item=>PERIODS[item.time].start>current);if(next){const wait=PERIODS[next.time].start-current;return wait<=20?`${next.title} starts in ${durationText(wait)} in ${next.room}.`:`Free time for ${durationText(wait)}. Next: ${next.title} at ${PERIODS[next.time].label.split(' – ')[0]} in ${next.room}.`}return `Your classes are complete for today. The last class was ${items[items.length-1].title}.`}
    function header(){const date=parseDate(state.selected);const wk=weekFor(date);const activeItems=activeDayItems(date);document.getElementById('dateInput').value=state.selected;document.getElementById('headerDay').textContent=DAY_NAMES[date.getDay()];document.getElementById('headerDate').textContent=state.selected;document.getElementById('headerWeek').textContent=wk>=1&&wk<=18?`Week ${wk}`:wk<1?'Before routine':'After routine';document.getElementById('dailyTitle').textContent=`${DAY_NAMES[date.getDay()]}’s schedule`;document.getElementById('dailyStatus').textContent=dailyBulletin(date,activeItems)}
    function weekPills(item,wk){return Array.from({length:18},(_,index)=>{const number=index+1;const on=active(item,number);const current=number===wk;return `<span class="week-dot ${on&&current?'active':''}">W${number}</span>`}).join('')}
    function courseCard(item,index,date){const subject=courseFor(item),look=styleFor(item),live=isLiveClass(item,date);return `<article class="course-card ${live?'is-live':''}" style="--accent:${look.accent};--accent2:${look.accent2};--subject-soft:${look.soft};--shape:${look.shape};animation-delay:${Math.min(index*38,190)}ms" data-course="${item.id}"><div class="course-info"><div class="course-title"><h3>${escapeHTML(item.title)}</h3><span class="subject-dots daily-subject-dots" aria-label="Subject colours"><i style="--dot:${look.accent}"></i><i style="--dot:${look.accent2}"></i></span></div><div class="detail-row"><span class="detail detail-location">${ICON.place}${escapeHTML(item.room)}</span><span class="detail">${ICON.person}${escapeHTML(item.teacher)}</span><span class="detail">${ICON.book}Lecture</span><span class="credit-inline">${subject.credits} credits</span></div><div class="time-left"><strong>${PERIODS[item.time].label}</strong><span>Period ${item.period}</span></div></div><div class="course-side"><div class="card-actions"><button class="mini-action ${isReminder(item)?'set':''}" type="button" data-reminder="${item.id}">${ICON.bell}<span>${isReminder(item)?'Reminder on':'Remind'}</span></button><button class="mini-action ${hasNote(item)?'note-has':''}" type="button" data-note="${item.id}">${ICON.note}<span>${hasNote(item)?'Edit note':'Add note'}</span></button></div></div></article>`}
    function renderDaily(){const date=parseDate(state.selected),wk=weekFor(date),items=activeDayItems(date);document.getElementById('dailySummary').innerHTML=`<b>${items.length} classes</b>`;document.getElementById('courseList').innerHTML=items.length?items.map((item,index)=>courseCard(item,index,date)).join(''):`<div class="empty"><span class="empty-symbol">${ICON.calendar}</span><h3>${wk<1||wk>18?'Routine not active for this date.':'No active classes today.'}</h3><p>${wk<1?'Week 1 begins on Monday, 31 August 2026. Use the date control above to open a routine day.':wk>18?'The 18-week schedule has ended. Use the date control above to review the routine.':'This day has no scheduled class in the selected academic week.'}</p></div>`}
    function eventCard(item){const c=courseFor(item),look=styleFor(item),live=isLiveClass(item,parseDate(state.selected));return `<button class="week-event ${live?'is-live':''}" type="button" data-note="${item.id}" style="--event:${look.event};--event-bg:${look.eventBg};--event-border:${look.eventBorder}"><b>${escapeHTML(item.title)}</b><span>${escapeHTML(item.room)}</span><small>${PERIODS[item.time].short} · ${c.credits} cr</small></button>`}
    function renderWeekly(){const wk=weekFor(parseDate(state.selected));document.getElementById('weeklyTitle').textContent=wk>=1&&wk<=18?`Week ${wk}`:'Outside the 18-week routine';document.getElementById('weeklySubtitle').textContent=wk>=1&&wk<=18?'Each academic week begins on Monday. Class boxes are grouped by weekday and period.':'Choose a date between 31 August 2026 and 3 January 2027 to see active graph boxes.';document.getElementById('weekLegend').innerHTML='';let html='<div class="grid-corner"></div>';html+=GRID_DAYS.map(day=>`<div class="day-heading"><strong>${DAY_NAMES[day]}</strong></div>`).join('');for(const timeKey of PERIOD_ORDER){const matching=CLASSES.filter(item=>item.time===timeKey&&active(item,wk));html+=`<div class="period-label"><strong>Periods ${matching[0]?.period||timeKey.replace('p','').replace(/(\d)(\d)/,'$1–$2')}</strong><span>${PERIODS[timeKey].short}</span></div>`;for(const day of GRID_DAYS){const item=matching.find(i=>i.day===day);html+=`<div class="week-cell">${item?eventCard(item):'<div class="no-event"></div>'}</div>`}}document.getElementById('weekGrid').innerHTML=html}
    function render(){header();renderDaily();renderWeekly();document.querySelectorAll('.view-tab').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===state.view));document.getElementById('dailyView').classList.toggle('hide',state.view!=='daily');document.getElementById('weeklyView').classList.toggle('show',state.view==='weekly')}
    let speechVoices=[];
    function refreshSpeechVoices(){if('speechSynthesis' in window)speechVoices=window.speechSynthesis.getVoices()}
    function preferredSpeechVoice(){const femaleHints=/Sonia|Hazel|Libby|Serena|Kate|Olivia|Emma|Female|Woman/i;return speechVoices.find(voice=>/^en-GB/i.test(voice.lang)&&femaleHints.test(voice.name))||speechVoices.find(voice=>/^en-GB/i.test(voice.lang))||speechVoices.find(voice=>/^en/i.test(voice.lang)&&femaleHints.test(voice.name))||speechVoices.find(voice=>/^en/i.test(voice.lang))||speechVoices[0]||null}
    function armSpokenAlerts(){if(!('speechSynthesis' in window))return;refreshSpeechVoices();const primer=new SpeechSynthesisUtterance('');primer.volume=1;primer.lang='en-GB';window.speechSynthesis.speak(primer)}
    function playAlertTone(){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const ctx=new AudioCtx(),tone=(frequency,when,duration)=>{const oscillator=ctx.createOscillator(),gain=ctx.createGain();oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.001,when);gain.gain.exponentialRampToValueAtTime(.4,when+.02);gain.gain.exponentialRampToValueAtTime(.001,when+duration);oscillator.connect(gain).connect(ctx.destination);oscillator.start(when);oscillator.stop(when+duration)};const now=ctx.currentTime;tone(880,now,.22);tone(1046,now+.3,.22);tone(1318,now+.6,.32);setTimeout(()=>ctx.close(),1600)}catch{}}
    function speakReminder(item,repeat=false){if(!state.spokenAlerts||!('speechSynthesis' in window))return;refreshSpeechVoices();const voice=preferredSpeechVoice(),start=PERIODS[item.time].label.split(' – ')[0];const phrase=repeat?`Reminder. ${item.title} begins at ${start}.`:`Attention. Your next class is ${item.title}. It begins in twenty minutes, at ${start}. Please prepare now.`;const speech=new SpeechSynthesisUtterance(phrase);speech.volume=1;speech.rate=.84;speech.pitch=1.07;speech.lang=voice?.lang||'en-GB';if(voice)speech.voice=voice;window.speechSynthesis.cancel();window.speechSynthesis.speak(speech)}
    const nativeApp=()=>typeof window.ScheduleNative!=='undefined';
    function requestReminderPermission(){if(nativeApp()){window.ScheduleNative.requestNotifications();return}if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(permission=>{if(permission==='granted')showToast('Phone alerts and spoken reminders are enabled.');else showToast('Spoken reminders remain on. Allow notifications in your browser settings for lock-screen alerts.','coral')})}
    async function notifyReminder(item){const text=`${item.title} begins at ${PERIODS[item.time].label.split(' – ')[0]} in 20 minutes.`;showToast(text,'blue');playAlertTone();speakReminder(item);setTimeout(()=>speakReminder(item,true),5000);if('vibrate' in navigator)navigator.vibrate([240,120,240,120,520,120,520]);if(nativeApp()){window.ScheduleNative.showClassNotification('Upcoming class',text);return}if('Notification' in window&&Notification.permission==='granted'){const options={body:text,icon:'./schedule-daily-logo.png',badge:'./schedule-daily-logo.png',tag:`class-${item.id}`,renotify:true,requireInteraction:true};try{const registration=await navigator.serviceWorker.ready;await registration.showNotification('Upcoming class',options)}catch{new Notification('Upcoming class',options)}}}
    function checkReminders(){if(nativeApp())return;const now=shanghaiClock(),today=parseDate(now.iso),todayItems=activeDayItems(today),todayKey=now.iso;todayItems.forEach(item=>{if(!isReminder(item))return;const reminderKey=`${item.id}:${todayKey}`,slot=PERIODS[item.time],current=now.minutes;if(current>=slot.start-20&&current<slot.start&&!state.reminderFired[reminderKey]){state.reminderFired[reminderKey]=true;sessionStorage.setItem('schedule-reminder-fired',JSON.stringify(state.reminderFired));notifyReminder(item)}})}

    function openNote(id){const item=CLASSES.find(x=>x.id===id);if(!item)return;state.openId=id;const course=courseFor(item);document.getElementById('modalEyebrow').textContent=`${course.credits} credits`;document.getElementById('modalTitle').textContent=item.title;document.getElementById('modalDetail').innerHTML=`<div>${ICON.place}<span>${escapeHTML(item.room)}</span></div><div>${ICON.person}<span>${escapeHTML(item.teacher)}</span></div><div>${ICON.calendar}<span>Periods ${item.period} · ${PERIODS[item.time].label}</span></div>`;document.getElementById('subjectNote').value=state.notes[item.title]||'';document.getElementById('modalReminder').textContent=isReminder(item)?'Turn reminder off':'Set reminder';document.getElementById('modalBackdrop').classList.add('open')}

    document.getElementById('dateInput').addEventListener('change',event=>{state.selected=event.target.value;render()});document.getElementById('prevButton').addEventListener('click',()=>{state.selected=toISO(addDays(parseDate(state.selected),-1));render()});document.getElementById('nextButton').addEventListener('click',()=>{state.selected=toISO(addDays(parseDate(state.selected),1));render()});document.getElementById('todayButton').addEventListener('click',()=>{state.selected=shanghaiClock().iso;render()});
    document.querySelector('.view-tabs').addEventListener('click',event=>{const tab=event.target.closest('[data-view]');if(!tab)return;state.view=tab.dataset.view;render()});document.getElementById('courseList').addEventListener('click',event=>{const r=event.target.closest('[data-reminder]');const n=event.target.closest('[data-note]');if(r)toggleReminder(r.dataset.reminder);if(n)openNote(n.dataset.note)});document.getElementById('weekGrid').addEventListener('click',event=>{const button=event.target.closest('[data-note]');if(button)openNote(button.dataset.note)});
    document.getElementById('closeModal').addEventListener('click',closeNote);document.getElementById('modalBackdrop').addEventListener('click',event=>{if(event.target===event.currentTarget)closeNote()});document.getElementById('saveNote').addEventListener('click',()=>{const item=CLASSES.find(x=>x.id===state.openId);if(!item)return;state.notes[item.title]=document.getElementById('subjectNote').value.trim();localStorage.setItem('schedule-subject-notes',JSON.stringify(state.notes));closeNote();renderDaily();showToast(`Note saved for ${item.title}.`)});document.getElementById('modalReminder').addEventListener('click',()=>{if(state.openId){toggleReminder(state.openId);const item=CLASSES.find(x=>x.id===state.openId);document.getElementById('modalReminder').textContent=isReminder(item)?'Turn reminder off':'Set reminder'}});
    if(nativeApp()){document.body.classList.add('android-app')}
    if('speechSynthesis' in window){refreshSpeechVoices();window.speechSynthesis.onvoiceschanged=refreshSpeechVoices}
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
    document.addEventListener('pointerdown',()=>{armSpokenAlerts();requestReminderPermission()},{once:true});
    render();checkReminders();setInterval(()=>{checkReminders();if(state.selected===shanghaiClock().iso)render()},30000);
